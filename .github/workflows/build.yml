name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tfm2-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tfm2-launcher-apk
          path: tfm2-launcher.apk
      - name: Publish rolling "latest-build" pre-release (pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build tfm2-launcher.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка (${GITHUB_REF_NAME})" \
            --notes "Автосборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. Для теста, не стабильный релиз."
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tfm2-launcher.apk
